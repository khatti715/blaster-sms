<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>System Terminal</title>
    <style>
        body { background: #0b0b0b; color: #00ff66; font-family: monospace; padding: 40px; }
        .hidden { display: none; }
        input, button { background: #1a1a1a; color: #00ff66; border: 1px solid #00ff66; padding: 10px; margin: 5px 0; }
        button { cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #00ff66; padding: 8px; text-align: left; }
    </style>
</head>
<body>
    <div id="auth-section">
        <h3>Authentication Required</h3>
        <input type="password" id="pass" placeholder="Enter Admin Password">
        <br>
        <button onclick="authenticate()">Access</button>
    </div>

    <div id="dashboard" class="hidden">
        <h3>Domain Authorization Control</h3>
        <input type="text" id="newDomain" placeholder="e.g., myallowedsite.com">
        <button onclick="modifyDomain('add')">Add Domain</button>
        
        <table>
            <thead>
                <tr><th>Allowed Domains</th><th>Action</th></tr>
            </thead>
            <tbody id="domainList"></tbody>
        </table>
    </div>

    <script>
        let currentPass = '';

        async function authenticate() {
            currentPass = document.getElementById('pass').value;
            const res = await fetch('/api/admin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: currentPass, action: 'get' })
            });
            if (res.ok) {
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                loadDomains();
            } else {
                alert('Access Denied');
            }
        }

        async function loadDomains() {
            const res = await fetch('/api/admin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: currentPass, action: 'get' })
            });
            const data = await res.json();
            const tbody = document.getElementById('domainList');
            tbody.innerHTML = '';
            data.domains.forEach(d => {
                tbody.innerHTML += `<tr><td>${d}</td><td><button onclick="modifyDomain('remove', '${d}')">Revoke</button></td></tr>`;
            });
        }

        async function modifyDomain(action, domain = null) {
            const targetDomain = domain || document.getElementById('newDomain').value;
            const res = await fetch('/api/admin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: currentPass, action, domain: targetDomain })
            });
            if (res.ok) {
                document.getElementById('newDomain').value = '';
                loadDomains();
            } else {
                alert('Operation failed.');
            }
        }
    </script>
</body>
</html>
